# Nacos 注册中心（单机模式），启动：docker compose -f doc/nacos/docker-compose.yml up -d
# 控制台：http://localhost:8848/nacos
# 各服务通过环境变量 NACOS_SERVER_ADDR 指定地址，默认 localhost:8848
services:
  nacos:
    image: nacos/nacos-server:v2.5.5
    container_name: shp-nacos
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"
