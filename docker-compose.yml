# 一键启动：docker compose up -d --build
# Nacos 控制台：http://localhost:8848/nacos   网关入口：http://localhost:8002 (gateway) / http://localhost:8080 (zuul)
x-service-env: &service-env
  NACOS_SERVER_ADDR: nacos:8848
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: root
  SPRING_REDIS_HOST: redis

x-depends: &depends
  nacos:
    condition: service_healthy
  mysql:
    condition: service_healthy
  redis:
    condition: service_started

services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shp
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - ./doc/db/shp.sql:/docker-entrypoint-initdb.d/shp.sql:ro
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 30

  redis:
    image: redis:6.2
    ports:
      - "6379:6379"

  nacos:
    image: nacos/nacos-server:v2.5.5
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      retries: 30

  shp-auth:
    build:
      context: .
      args:
        MODULE: shp_auth
    environment: *service-env
    depends_on: *depends
    ports:
      - "8000:8000"

  shp-admin:
    build:
      context: .
      args:
        MODULE: shp_admin/shp_admin_biz
    environment:
      <<: *service-env
      GATEWAY_URL: http://shp-gateway:8002
    depends_on: *depends
    ports:
      - "8001:8001"

  shp-gateway:
    build:
      context: .
      args:
        MODULE: shp_gateway
    environment:
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
    ports:
      - "8002:8002"

  shp-zuul:
    build:
      context: .
      args:
        MODULE: shp_zuul
    environment:
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  mysql-data:
