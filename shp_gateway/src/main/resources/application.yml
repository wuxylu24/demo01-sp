server:
  port: 8002
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: shp-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    gateway:
      locator:
        enabled: true
      routes:
        - id: shp-auth
          uri: lb://shp-auth
          predicates:
            - Path=/api/auth/**
          filters:
#            - SwaggerHeaderFilter
            - StripPrefix=2
            - name: Hystrix
              args:
                name: oauth-hystrix
                fallbackUri: forward:/common/fallback #设置熔断器
        - id: shp-admin
          uri: lb://shp-admin
          predicates:
            - Path=/api/admin/**
          filters:
#            - SwaggerHeaderFilter
            - StripPrefix=2
            - name: Hystrix
              args:
                name: admin-hystrix
                fallbackUri: forward:/common/fallback #设置熔断器

hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 30000

management:
  metrics:
    web:
      server:
        auto-time-requests: false
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    bus-refresh:
      enabled: true
